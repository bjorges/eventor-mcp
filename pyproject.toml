[project]
name = "eventor-mcp"
version = "0.1.0"
description = "MCP server for the Eventor (Norwegian/Swedish orienteering) REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # Pinned below 2.0: mcp 2.x renamed FastMCP to MCPServer with a
    # different API. This code uses the FastMCP decorator pattern from 1.x.
    "mcp>=1.2.0,<2.0.0",
    "httpx>=0.27.0",
    "xmltodict>=0.13.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
eventor-mcp = "eventor_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventor_mcp"]
